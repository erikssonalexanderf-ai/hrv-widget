
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>HRV Trends</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin: 0;
    padding: 10px;
    font-family: Arial, sans-serif;
    background: black;
    color: orange;
}

h2 {
    text-align: center;
    margin: 5px 0 15px 0;
}

.chart-container {
    width: 100%;
    height: 400px;
}

</style>

</head>


<body>

<h2>HRV Trends</h2>

<div class="chart-container">

<canvas id="hrvChart"></canvas>

</div>


<script>

const hrvData = [{"date": "2026-08-09", "weekly_average": 79, "last_night_average": 98, "last_night_5min_high": 136, "status": "LOW", "balanced_low": 86, "balanced_upper": 113}, {"date": "2026-08-10", "weekly_average": 81, "last_night_average": 89, "last_night_5min_high": 126, "status": "UNBALANCED", "balanced_low": 86, "balanced_upper": 113}, {"date": "2026-08-11", "weekly_average": 81, "last_night_average": 73, "last_night_5min_high": 106, "status": "UNBALANCED", "balanced_low": 86, "balanced_upper": 113}, {"date": "2026-08-12", "weekly_average": 81, "last_night_average": 72, "last_night_5min_high": 108, "status": "UNBALANCED", "balanced_low": 85, "balanced_upper": 113}, {"date": "2026-08-13", "weekly_average": 82, "last_night_average": 84, "last_night_5min_high": 130, "status": "UNBALANCED", "balanced_low": 85, "balanced_upper": 112}, {"date": "2026-08-14", "weekly_average": 81, "last_night_average": 80, "last_night_5min_high": 119, "status": "UNBALANCED", "balanced_low": 85, "balanced_upper": 112}, {"date": "2026-08-15", "weekly_average": 80, "last_night_average": 70, "last_night_5min_high": 100, "status": "UNBALANCED", "balanced_low": 84, "balanced_upper": 112}];


const labels = hrvData.map(
    entry => entry.date
);


const overnight = hrvData.map(
    entry => entry.last_night_average
);


const weekly = hrvData.map(
    entry => entry.weekly_average
);


const balancedLow = hrvData.map(
    entry => entry.balanced_low
);


const balancedUpper = hrvData.map(
    entry => entry.balanced_upper
);


const ctx = document.getElementById(
    "hrvChart"
);


new Chart(ctx, {

    type: "line",

    data: {

        labels: labels,

        datasets: [

            {
                label: "Overnight Average",

                data: overnight,

                borderColor: "gray",

                borderWidth: 1,

                pointRadius: 1,

                tension: 0.2
            },

            {
                label: "Weekly Average",

                data: weekly,

                borderWidth: 3,

                pointRadius: 3,

                tension: 0.2,

                segment: {
                    borderColor: function(context) {

                        const index = context.p0DataIndex;

                        const value = weekly[index];

                        const low = balancedLow[index];

                        const high = balancedUpper[index];

                        if (value >= low && value <= high) {

                            return "lime";

                        } else if (
                            value >= low - 10 &&
                            value <= high + 10
                        ) {

                            return "yellow";

                        } else {

                            return "red";

                        }

                    }

                }

            },

            {
                label: "Garmin Balanced Range",

                data: balancedUpper,

                borderWidth: 0,

                pointRadius: 0,

                fill: "+1",

                backgroundColor: "rgba(100, 180, 100, 0.15)"
            },

            {
                label: "",

                data: balancedLow,

                borderWidth: 0,

                pointRadius: 0,

                fill: false
            }

        ]

    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

        interaction: {

            mode: "index",

            intersect: false

        },

        plugins: {

            legend: {

                display: true

            }

        },

        scales: {

            x: {

                ticks: {

                    maxTicksLimit: 8,

                    callback: function(value) {

                        const date = new Date(
                            this.getLabelForValue(value)
                        );

                        return date.toLocaleDateString(
                            "en-US",
                            {
                                month: "short",
                                day: "numeric"
                            }
                        );

                    }

                }

            },

            y: {
            
                min: 40,

                max: 140,

                title: {

                    display: true,

                    text: "HRV (ms)"

                }

            }

        }

    }

});

</script>

</body>

</html>
