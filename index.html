// ========================================================
// CREATE CHART
// ========================================================

let hrvChart;


function createChart(days) {

    const hrvData = allHrvData.slice(-days);


    // ----------------------------------------------------
    // DATA
    // ----------------------------------------------------

    const labels = hrvData.map(
        entry => entry.date
    );


    const overnight = hrvData.map(
        entry => entry.last_night_average
    );


    const weekly = hrvData.map(
        entry => entry.weekly_average
    );


    const balancedLow = hrvData.map(
        entry => entry.balanced_low
    );


    const balancedUpper = hrvData.map(
        entry => entry.balanced_upper
    );


    // ----------------------------------------------------
    // DESTROY OLD CHART
    // ----------------------------------------------------

    if (hrvChart) {

        hrvChart.destroy();

    }


    // ----------------------------------------------------
    // CREATE CHART
    // ----------------------------------------------------

    const ctx = document.getElementById(
        "hrvChart"
    );


    hrvChart = new Chart(ctx, {

        type: "line",


        // ------------------------------------------------
        // DATASETS
        // ------------------------------------------------

        data: {

            labels: labels,


            datasets: [

                // ----------------------------------------
                // Overnight Average
                // ----------------------------------------

                {
                    label: "Overnight Average",

                    data: overnight,

                    borderColor: "gray",

                    borderWidth: 1,

                    pointRadius: 1,

                    tension: 0.2
                },


                // ----------------------------------------
                // Weekly Average
                // ----------------------------------------

                {
                    label: "Weekly Average",

                    data: weekly,

                    borderWidth: 3,

                    pointRadius: 3,

                    tension: 0.2,


                    segment: {

                        borderColor: function(context) {

                            const index =
                                context.p0DataIndex;


                            const value =
                                weekly[index];


                            const low =
                                balancedLow[index];


                            const high =
                                balancedUpper[index];


                            if (
                                value >= low &&
                                value <= high
                            ) {

                                return "lime";

                            }

                            else if (

                                value >= low - 10 &&
                                value <= high + 10

                            ) {

                                return "yellow";

                            }

                            else {

                                return "red";

                            }

                        }

                    }

                },


                // ----------------------------------------
                // Balanced Range Upper
                // ----------------------------------------

                {
                    label: "Garmin Balanced Range",

                    data: balancedUpper,

                    borderWidth: 0,

                    pointRadius: 0,

                    fill: "+1",

                    backgroundColor:
                        "rgba(100, 180, 100, 0.15)"
                },


                // ----------------------------------------
                // Balanced Range Lower
                // ----------------------------------------

                {
                    label: "Garmin Balanced Range",

                    data: balancedLow,

                    borderWidth: 0,

                    pointRadius: 0,

                    fill: false
                }

            ]

        },


        // ====================================================
        // OPTIONS
        // ====================================================

        options: {

            responsive: true,

            maintainAspectRatio: false,


            // ------------------------------------------------
            // Interaction
            // ------------------------------------------------

            interaction: {

                mode: "index",

                intersect: false

            },


            // ------------------------------------------------
            // Legend
            // ------------------------------------------------

            plugins: {

                legend: {

                    display: true,

                    labels: {

                        color: "orange",

                        filter: function(item, chart) {

                            // Hide lower balanced-range dataset
                            return item.datasetIndex !== 3;

                        }

                    }

                }

            },


            // ------------------------------------------------
            // Axes
            // ------------------------------------------------

            scales: {

                // --------------------------------------------
                // X AXIS
                // --------------------------------------------

                x: {

                    ticks: {

                        color: "orange",

                        maxTicksLimit: 8,


                        callback: function(value) {

                            const date = new Date(

                                this.getLabelForValue(value)

                            );


                            return date.toLocaleDateString(

                                "en-US",

                                {

                                    month: "short",

                                    day: "numeric"

                                }

                            );

                        }

                    },


                    title: {

                        display: true,

                        text: "Date",

                        color: "orange"

                    },


                    grid: {

                        color:
                            "rgba(255, 165, 0, 0.2)"

                    }

                },


                // --------------------------------------------
                // Y AXIS
                // --------------------------------------------

                y: {

                    min: 40,

                    max: 140,


                    ticks: {

                        color: "orange"

                    },


                    title: {

                        display: true,

                        text: "HRV (ms)",

                        color: "orange"

                    },


                    grid: {

                        color:
                            "rgba(255, 165, 0, 0.2)"

                    }

                }

            }

        }

    });

}


// ========================================================
// RANGE SELECTOR
// ========================================================

document
    .getElementById("rangeSelect")
    .addEventListener("change", function() {

        const days = parseInt(
            this.value
        );


        createChart(days);

    });


// ========================================================
// INITIAL CHART
// ========================================================

createChart(56);

</script>
